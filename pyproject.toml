[project]
name = "learning"
version = "0.1.0"
description = "Topic-oriented notes, notebooks, exercises, and learning resources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "apscheduler>=3.11",
    "arq>=0.28",
    "celery[redis]>=5.6",
    "dask[distributed]>=2024.8",
    "dramatiq[redis]>=2.2",
    "gradio>=6.14",
    "ipykernel>=6.29",
    "ipython>=8.18",
    "ipywidgets>=8.1",
    "matplotlib>=3.10",
    "notebook>=7.6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "playwright>=1.55",
    "pydantic>=2.11",
    "ray>=2.44",
    "ruff>=0.15",
    "scikit-learn>=1.8",
    "streamlit>=1.57",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "*.pdf"]

[tool.ruff.lint]
# Notebook cells are intentionally independent examples, so imports and names
# may repeat across cells.
ignore = ["E402", "E741", "F401", "F811", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
